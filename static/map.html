<!DOCTYPE html>
<!--
    Stand-alone Leaflet view opened with ?place=CityName alongside the SPA map.
    Kept deliberately tiny so demos can screenshot OSM pins without homepage chrome.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Map</title>
    <link rel="stylesheet" href="/static/leaflet/leaflet.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .map-header {
            padding: 18px 24px;
            background: #0f172a;
            color: white;
        }

        .map-header h2 {
            margin: 0;
            font-size: 24px;
        }

        #map {
            width: 100%;
            height: calc(100vh - 80px);
        }
    </style>
</head>
<body>
    <div class="map-header">
        <h2 id="locationTitle">Travel Map</h2>
    </div>

    <div id="map"></div>

    <script src="/static/leaflet/leaflet.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const place = (params.get("place") || "").trim();
        const title = document.getElementById("locationTitle");

        // This small page is kept for opening a destination map in a separate tab.
        // It uses the local Leaflet files so the map still works without a CDN.
        title.textContent = place || "Travel Map";

        const knownLocations = {
            "hunza": [36.3167, 74.65],
            "hunza valley": [36.3167, 74.65],
            "skardu": [35.2971, 75.6333],
            "murree": [33.9045, 73.3903],
            "islamabad": [33.6844, 73.0479],
            "swat": [35.2227, 72.4258],
            "swat valley": [35.2227, 72.4258],
            "lahore": [31.5497, 74.3436],
            "karachi": [24.8607, 67.0011],
            "gwadar": [25.1264, 62.3225],
            "gwadar beach": [25.1264, 62.3225]
        };

        let travelMap = null;
        let selectedMarker = null;

        /** Creates (or recreates) the Leaflet map with Pakistan-wide defaults. */
        function initializeMap() {
            if (typeof L === "undefined") {
                title.textContent = "Map library failed to load";
                return null;
            }

            // Remove old map instance before creating a new one.
            if (travelMap) {
                travelMap.off();
                travelMap.remove();
                travelMap = null;
                selectedMarker = null;
            }

            travelMap = L.map("map").setView([30.3753, 69.3451], 6);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "&copy; OpenStreetMap contributors",
                maxZoom: 19
            }).addTo(travelMap);

            setTimeout(() => travelMap.invalidateSize(), 150);
            return travelMap;
        }

        initializeMap();

        /** Repositions the map and marker for a resolved coordinate pair. */
        function showLocation(lat, lng, name) {
            if (!travelMap) return;

            const numericLat = Number(lat);
            const numericLng = Number(lng);
            if (!Number.isFinite(numericLat) || !Number.isFinite(numericLng)) {
                title.textContent = "Invalid map coordinates";
                return;
            }

            travelMap.setView([numericLat, numericLng], 12);

            // This marker highlights the selected travel destination.
            if (!selectedMarker) {
                selectedMarker = L.marker([numericLat, numericLng]).addTo(travelMap);
            } else {
                selectedMarker.setLatLng([numericLat, numericLng]);
            }

            selectedMarker.bindPopup(name).openPopup();
            setTimeout(() => travelMap.invalidateSize(), 150);
        }

        /** Resolves `place` via static dictionary first, then nominatim if needed. */
        async function loadLocation() {
            if (!place) return;

            const known = knownLocations[place.toLowerCase()];
            if (known) {
                showLocation(known[0], known[1], place);
                return;
            }

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(place)}`
                );

                if (!response.ok) {
                    throw new Error("Location lookup failed.");
                }

                const data = await response.json();
                if (!Array.isArray(data) || !data.length) {
                    title.textContent = "Location not found";
                    return;
                }

                showLocation(parseFloat(data[0].lat), parseFloat(data[0].lon), place);
            } catch (error) {
                console.error(error);
                title.textContent = "Unable to load map location";
            }
        }

        loadLocation();
    </script>
</body>
</html>
