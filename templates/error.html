<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ error_code }} - AI Travel Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .error-page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            padding: 2rem;
        }
        .error-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        }
        .error-icon {
            width: 60px;
            height: 60px;
            background: #fee2e2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 26px;
        }
        .error-badge {
            display: inline-block;
            padding: 4px 14px;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 0.5rem;
        }
        .error-message {
            font-size: 14px;
            color: #64748b;
            margin: 0 0 1.75rem;
            line-height: 1.6;
        }
        .error-btn {
            display: inline-block;
            padding: 10px 24px;
            background: #ef4444;
            color: #ffffff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .error-btn:hover { background: #dc2626; }
        .error-home-link {
            display: block;
            margin-top: 1rem;
            font-size: 13px;
            color: #94a3b8;
            text-decoration: none;
        }
        .error-home-link:hover { color: #475569; }
    </style>
</head>
<body>
    <div class="error-page-wrapper">
        <div class="error-box">
            <div class="error-icon">
                {% if error_code == 403 %}🚫{% else %}🔒{% endif %}
            </div>
            <span class="error-badge">
                {{ error_code }} — {{ error_title }}
            </span>
            <h1 class="error-title">{{ error_title }}</h1>
            <p class="error-message">{{ error_message }}</p>
            {% if error_code == 401 %}
                <a href="/login" class="error-btn">Sign In</a>
            {% else %}
                <a href="/" class="error-btn">Go to Homepage</a>
            {% endif %}
            <a href="/" class="error-home-link">← Back to Home</a>
        </div>
    </div>
</body>
</html>
