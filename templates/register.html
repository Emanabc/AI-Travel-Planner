<!DOCTYPE html>

<html>
<head>
  <title>Register - AI Travel Planner</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>

<nav>
  <div class="logo">AI Travel Planner</div>
  <ul>
    <li><a href="{{ url_for('home') }}">Home</a></li>
    <li><a href="{{ url_for('login_page') }}">Login</a></li>
    <li><a href="{{ url_for('register_page') }}">Register</a></li>
    <li><a href="{{ url_for('profile_page') }}">Profile</a></li>
    <li><a href="{{ url_for('admin_page') }}">Admin</a></li>
</ul>
</nav>

<div class="form-container">
  <h1>Register</h1>

  <!--  FORM ADDED -->
  <form id="registerForm">

    <input type="text" id="name" placeholder="Full Name" required>
    
    <input type="email" id="email" placeholder="Email" required>
    
    <input type="password" id="password" placeholder="Password" required>
    
    <button type="submit">Register</button>

  </form>

  <p id="message"></p>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("/register", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById("message").innerHTML = "Registration Successful ✅";
            document.getElementById("message").style.color = "green";

            setTimeout(() => {
               window.location.href = "/login";            }, 1000);

        } else {
            document.getElementById("message").innerHTML = data.message || "Registration Failed";
            document.getElementById("message").style.color = "red";
        }

    } catch (error) {
        document.getElementById("message").innerHTML = "Server not reachable ❌";
        document.getElementById("message").style.color = "red";
        console.error(error);
    }
});
</script>

</body>
</html>
